<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wan!Voice - Supabase</title>
<style>
:root{
  /* Base - Calm Optimism palette */
  --bg:#FAFBFD;
  --card:#FFFFFF;
  --card-2:#F4F6FA;
  --card-hover:#F9FAFC;
  
  /* Borders - subtle blue tint */
  --b:rgba(15,31,61,0.08);
  --bl:rgba(15,31,61,0.12);
  --bll:rgba(15,31,61,0.16);
  
  /* Text - deep navy hierarchy */
  --t1:#0F1F3D;
  --t2:#475569;
  --t3:#94A3B8;
  --t4:#CBD5E1;
  
  /* Brand */
  --a:#1A4FA0;
  --a-hover:#163F80;
  --supa:#14B8A6;
  --ai:#6366F1;
  
  /* Category colors - hopeful */
  --good:#10B981;
  --warn:#F59E0B;
  --bad:#DC2626;
  --other:#8B5CF6;
  --hot:#F97316;
  
  /* Spacing */
  --r-card:12px;
  --r-btn:8px;
  --r-tag:6px;
  --r-lg:14px;
  --sb:env(safe-area-inset-bottom,0px);
  
  /* Apple-style layered shadows - with navy tint */
  --shadow-card:
    0 1px 2px rgba(15,31,61,0.04),
    0 4px 14px rgba(15,31,61,0.06);
  --shadow-card-hover:
    0 2px 6px rgba(15,31,61,0.08),
    0 14px 32px rgba(15,31,61,0.1);
  --shadow-brand:
    0 1px 2px rgba(26,79,160,0.14),
    0 8px 24px rgba(26,79,160,0.26);
  --shadow-brand-hover:
    0 2px 6px rgba(26,79,160,0.18),
    0 16px 36px rgba(26,79,160,0.34);
  --shadow-float:
    0 2px 8px rgba(15,31,61,0.06),
    0 20px 56px rgba(15,31,61,0.14);
  --shadow-modal:
    0 4px 20px rgba(15,31,61,0.1),
    0 40px 96px rgba(15,31,61,0.22);
  
  /* Inset highlights for glass feel */
  --highlight-top:inset 0 1px 0 rgba(255,255,255,0.9);
  --highlight-dark:inset 0 1px 0 rgba(255,255,255,0.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Hiragino Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100dvh;line-height:1.6;overflow-x:hidden;font-size:15px;-webkit-font-smoothing:antialiased;letter-spacing:-0.003em}
html{overflow-x:hidden}
body.modal-open{overflow:hidden;position:fixed;width:100%}

.hd{background:rgba(251,251,249,0.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--b);padding:16px 24px;position:sticky;top:0;z-index:100}
.hdc{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto}
.hdb{display:flex;align-items:center;gap:14px}
.logo{width:38px;height:38px;background:#1A4FA0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;letter-spacing:-0.5px;box-shadow:var(--shadow-brand),var(--highlight-dark)}
.brt{font-size:17px;font-weight:700;color:var(--t1);letter-spacing:-0.02em}
.brs{font-size:12px;color:var(--t3);letter-spacing:0;font-weight:400;margin-top:2px}
.hdr{display:flex;gap:6px;align-items:center}
.conn-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:#fff;border:1px solid var(--b);border-radius:999px;font-size:11px;color:var(--t3);font-weight:600;letter-spacing:0.06em;box-shadow:var(--shadow-card);white-space:nowrap;flex-shrink:0}
.conn-badge.on{background:rgba(5,150,105,0.06);border-color:rgba(5,150,105,0.22);color:#059669;box-shadow:0 1px 2px rgba(5,150,105,0.08),0 4px 12px rgba(5,150,105,0.1)}
.conn-badge.on::before{content:'';width:6px;height:6px;min-width:6px;min-height:6px;background:#10B981;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(16,185,129,0.18)}
.hbtn{width:38px;height:38px;background:#fff;border:1px solid var(--b);border-radius:var(--r-btn);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-card),var(--highlight-top)}
.hbtn:hover{background:#fff;border-color:var(--bl);color:var(--t1);transform:translateY(-1px);box-shadow:var(--shadow-card-hover),var(--highlight-top)}
.hbtn:active{transform:translateY(0);box-shadow:var(--shadow-card),var(--highlight-top)}
.hbtn svg{width:17px;height:17px}
.hbtn input{position:absolute;opacity:0;width:0;height:0}
label.hbtn{position:relative}

.mn{padding:32px 24px;padding-bottom:calc(120px + var(--sb));max-width:1200px;margin:0 auto}

/* Setup Section */
.setup-section{background:var(--card);border:1px solid var(--b);border-radius:var(--r-card);padding:32px;margin-bottom:24px;box-shadow:var(--shadow-card),var(--highlight-top)}
.setup-header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.setup-icon{width:44px;height:44px;background:#1A4FA0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:var(--shadow-brand),var(--highlight-dark)}
.setup-title{font-size:20px;font-weight:700;color:var(--t1);letter-spacing:-0.02em}
.setup-desc{font-size:14px;color:var(--t3);margin-top:2px}
.setup-form{display:flex;flex-direction:column;gap:16px}
.setup-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.setup-row{grid-template-columns:1fr}}
.setup-label{font-size:13px;color:var(--t2);margin-bottom:6px;display:block;font-weight:500}
.setup-input{width:100%;padding:11px 14px;background:var(--card-2);border:1px solid var(--b);border-radius:var(--r-btn);color:var(--t1);font-size:14px;font-family:-apple-system,'SF Mono',monospace;transition:all 0.2s cubic-bezier(0.4,0,0.2,1)}
.setup-input:focus{outline:none;border-color:var(--a);background:#fff;box-shadow:0 0 0 3px rgba(26,79,160,0.1),0 1px 2px rgba(26,79,160,0.05)}
.setup-input::placeholder{color:var(--t4)}
.setup-btns{display:flex;gap:10px;margin-top:6px}
.setup-btn{flex:1;padding:13px;border-radius:var(--r-btn);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);letter-spacing:-0.01em}
.setup-btn.primary{background:#1A4FA0;color:#fff;box-shadow:var(--shadow-brand),var(--highlight-dark)}
.setup-btn.primary:hover{background:#163F80;transform:translateY(-1px);box-shadow:var(--shadow-brand-hover),var(--highlight-dark)}
.setup-btn.primary:active{transform:translateY(0);box-shadow:var(--shadow-brand),var(--highlight-dark)}
.setup-btn.secondary{background:#fff;color:var(--t2);border-color:var(--b);box-shadow:var(--shadow-card),var(--highlight-top)}
.setup-btn.secondary:hover{color:var(--t1);transform:translateY(-1px);box-shadow:var(--shadow-card-hover),var(--highlight-top)}
.setup-btn.secondary:active{transform:translateY(0);box-shadow:var(--shadow-card),var(--highlight-top)}
.setup-status{padding:12px 14px;border-radius:var(--r-btn);font-size:13px;margin-top:12px;display:none;font-weight:500}
.setup-status.success{display:block;background:rgba(5,150,105,0.06);color:#059669;border:1px solid rgba(5,150,105,0.18)}
.setup-status.error{display:block;background:rgba(220,38,38,0.06);color:#DC2626;border:1px solid rgba(220,38,38,0.18)}

/* Icon system */
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon-sm{width:14px;height:14px}
.icon-lg{width:22px;height:22px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
@media(min-width:600px){.stats{grid-template-columns:repeat(5,1fr);gap:12px}}
.stat{background:var(--card);border:1px solid var(--b);border-radius:var(--r-card);padding:22px 18px;text-align:left;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-card),var(--highlight-top);cursor:default}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover),var(--highlight-top);border-color:var(--bl)}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;background:rgba(15,31,61,0.06);color:var(--t2)}
.stat-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat.good .stat-icon{background:rgba(16,185,129,0.1);color:#10B981}
.stat.warn .stat-icon{background:rgba(245,158,11,0.12);color:#D97706}
.stat.bad .stat-icon{background:rgba(220,38,38,0.1);color:#DC2626}
.stat.hot .stat-icon{background:rgba(249,115,22,0.1);color:#F97316}
.stat-val{font-size:32px;font-weight:700;letter-spacing:-0.03em;color:var(--t1);line-height:1}
.stat-label{font-size:13px;color:var(--t3);margin-top:6px;font-weight:500}
.stat.good .stat-val,.stat.warn .stat-val,.stat.bad .stat-val,.stat.hot .stat-val{color:var(--t1)}

/* Charts */
.charts{display:grid;gap:16px;margin-bottom:20px}
@media(min-width:900px){.charts{grid-template-columns:1.4fr 0.6fr}}
.card{background:var(--card);border:1px solid var(--b);border-radius:var(--r-card);padding:28px;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-card),var(--highlight-top)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover),var(--highlight-top);border-color:var(--bl)}
.card-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px;min-width:0}
.card-header #dashSessionFilter{max-width:100%;min-width:0}
@media(max-width:600px){
  .card-header #dashSessionFilter{width:100%;flex:1 1 100%}
}
.card-title{font-size:15px;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:10px;letter-spacing:-0.01em}
.card-title svg{width:18px;height:18px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.list-title svg{width:18px;height:18px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.qbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.qbtn{display:inline-flex;align-items:center;gap:7px}
.item-meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:0.7}
.item-meta span{display:inline-flex;align-items:center;gap:5px}
.dup-header svg{width:14px;height:14px;stroke:var(--hot);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.bar-wrap{position:relative;padding-left:32px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.bar-wrap::-webkit-scrollbar{height:4px}
.bar-wrap::-webkit-scrollbar-thumb{background:rgba(17,17,17,0.15);border-radius:2px}
.bar-y{position:absolute;left:0;top:0;bottom:24px;width:28px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--t3);text-align:right}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:140px;border-bottom:1px solid var(--b);padding-bottom:8px}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar-stack{width:100%;max-width:40px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.bar-seg{width:100%;transition:height 0.5s ease}
.bar-label{font-size:12px;color:var(--t3);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);padding:4px 10px;border-radius:var(--r-tag);border:1px solid var(--b);font-weight:500}
.legend-dot{width:8px;height:8px;border-radius:2px}

.pie-wrap{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;padding:10px 0}
.pie-wrap.pie-main{gap:48px;padding:28px 0}
.pie-wrap.pie-main .pie-container{width:200px;height:200px}
.pie-wrap.pie-main .pie-center{width:120px;height:120px}
.pie-wrap.pie-main .pie-val{font-size:36px}
.pie-wrap.pie-main .pie-item{font-size:14px;min-width:140px}
.pie-wrap.pie-main .pie-dot{width:14px;height:14px}
@media(max-width:600px){
  .pie-wrap.pie-main{gap:20px;padding:10px 0}
  .pie-wrap.pie-main .pie-container{width:170px;height:170px}
  .pie-wrap.pie-main .pie-center{width:100px;height:100px}
  .pie-wrap.pie-main .pie-val{font-size:30px}
}
.pie-container{position:relative;width:160px;height:160px}
.pie{width:100%;height:100%;border-radius:50%;transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);box-shadow:0 4px 12px rgba(17,17,17,0.06),0 16px 40px rgba(17,17,17,0.08)}
.pie:hover{transform:scale(1.03)}
.pie-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;background:#fff;width:100px;height:100px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--b),0 2px 8px rgba(17,17,17,0.04)}
.pie-val{font-size:30px;font-weight:700;color:var(--t1);letter-spacing:-0.03em}
.pie-label{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:0.15em;font-weight:600;margin-top:2px}
.pie-legend{display:flex;flex-direction:column;gap:14px;min-width:180px}
.pie-item{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--t1);font-weight:500}
.pie-dot{width:10px;height:10px;border-radius:2px}
.pie-pct{margin-left:auto;color:var(--t2);font-weight:600;font-variant-numeric:tabular-nums}

/* AI Chat */
.ai-section{background:var(--card);border:1px solid var(--b);border-radius:var(--r-card);padding:28px;margin-bottom:20px;box-shadow:var(--shadow-card),var(--highlight-top);transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}
.ai-section:hover{box-shadow:var(--shadow-card-hover),var(--highlight-top)}
.ai-header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.ai-avatar{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,#6366F1,#8B5CF6);box-shadow:0 1px 2px rgba(99,102,241,0.14),0 8px 24px rgba(99,102,241,0.28),var(--highlight-dark)}
.ai-avatar svg{width:100%;height:100%}
.ai-info h3{font-size:15px;font-weight:600;color:var(--t1);letter-spacing:-0.01em}
.ai-info p{font-size:13px;color:var(--t3);margin-top:2px}
.ai-status{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#059669;font-weight:600;letter-spacing:0.06em;white-space:nowrap;flex-shrink:0}
.ai-status::before{content:'';width:6px;height:6px;min-width:6px;min-height:6px;background:#10B981;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(16,185,129,0.18)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.9)}}

.quick-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.qbtn{padding:8px 14px;background:#fff;border:1px solid var(--b);border-radius:999px;color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);letter-spacing:-0.005em;box-shadow:var(--shadow-card)}
.qbtn:hover{border-color:var(--bl);color:var(--t1);transform:translateY(-1px);box-shadow:var(--shadow-card-hover)}
.qbtn:active{transform:translateY(0);box-shadow:var(--shadow-card)}
.qbtn.qbtn-summary svg{stroke:var(--t2)}
.qbtn.qbtn-good svg{stroke:#10B981}
.qbtn.qbtn-warn svg{stroke:#D97706}
.qbtn.qbtn-bad svg{stroke:#DC2626}
.qbtn.qbtn-hot svg{stroke:#F97316}
.qbtn.qbtn-trend svg{stroke:#8B5CF6}

.chat-box{max-height:280px;overflow-y:auto;margin-bottom:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:85%;padding:12px 16px;border-radius:var(--r-lg);font-size:14px;line-height:1.6;animation:msgIn 0.3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{background:var(--card-2);color:var(--t1);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(17,17,17,0.03)}
.msg.user{background:#1A4FA0;color:#fff;align-self:flex-end;border-bottom-right-radius:4px;box-shadow:var(--shadow-brand),var(--highlight-dark)}
.typing{display:flex;gap:5px;padding:12px 16px}
.typing span{width:7px;height:7px;background:var(--t3);border-radius:50%;animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}

.chat-input-wrap{display:flex;gap:10px}
.chat-input{flex:1;padding:12px 16px;background:var(--card-2);border:1px solid var(--b);border-radius:var(--r-btn);color:var(--t1);font-size:14px;transition:all 0.2s cubic-bezier(0.4,0,0.2,1)}
.chat-input:focus{outline:none;border-color:var(--a);background:#fff;box-shadow:0 0 0 3px rgba(26,79,160,0.1),0 1px 2px rgba(26,79,160,0.05)}
.chat-input::placeholder{color:var(--t4)}
.chat-send{width:44px;height:44px;background:#1A4FA0;border:none;border-radius:var(--r-btn);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-brand),var(--highlight-dark)}
.chat-send:hover{background:#163F80;transform:translateY(-1px);box-shadow:var(--shadow-brand-hover),var(--highlight-dark)}
.chat-send:active{transform:translateY(0);box-shadow:var(--shadow-brand),var(--highlight-dark)}
.chat-send svg{width:18px;height:18px}

/* Data List */
.list-section{background:var(--card);border:1px solid var(--b);border-radius:var(--r-card);padding:28px;box-shadow:var(--shadow-card),var(--highlight-top);transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}
.list-section:hover{box-shadow:var(--shadow-card-hover),var(--highlight-top)}
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.list-title{font-size:16px;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:10px;letter-spacing:-0.01em}
.list-filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-select{padding:9px 12px;background:#fff;border:1px solid var(--b);border-radius:var(--r-btn);color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-card);max-width:100%}
.filter-select:focus,.filter-select:hover{outline:none;border-color:var(--bl);color:var(--t1);box-shadow:var(--shadow-card-hover)}
.search-box{position:relative}
.search-box input{padding:9px 12px 9px 36px;background:#fff;border:1px solid var(--b);border-radius:var(--r-btn);color:var(--t1);font-size:13px;width:200px;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-card)}
.search-box input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(26,79,160,0.1),var(--shadow-card)}
.search-box input::placeholder{color:var(--t4)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--t3)}

.data-list{display:flex;flex-direction:column;gap:10px;max-height:640px;overflow-y:auto;padding:4px}
.data-item{background:var(--card);border:1px solid var(--b);border-radius:var(--r-card);padding:20px;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-card),var(--highlight-top)}
.data-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover),var(--highlight-top);border-color:var(--bl)}
.data-item.dup{border-left:3px solid var(--hot)}
.item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.item-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:var(--r-tag);font-size:12px;font-weight:600;letter-spacing:-0.005em}
.tag.good{background:rgba(16,185,129,0.1);color:#059669}
.tag.warn{background:rgba(245,158,11,0.1);color:#B45309}
.tag.bad{background:rgba(220,38,38,0.08);color:#DC2626}
.tag.other{background:rgba(139,92,246,0.1);color:#7C3AED}
.tag.pending{background:rgba(148,163,184,0.12);color:#64748B;animation:pulse 1.5s ease-in-out infinite}
.del-btn{background:#fff;border:1px solid var(--b);color:var(--t3);padding:6px 12px;border-radius:var(--r-tag);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-card)}
.del-btn:hover{background:rgba(220,38,38,0.06);border-color:rgba(220,38,38,0.2);color:#DC2626;transform:translateY(-1px);box-shadow:0 2px 4px rgba(220,38,38,0.06),0 4px 12px rgba(220,38,38,0.08)}
.del-btn:active{transform:translateY(0)}
.item-content{font-size:15px;line-height:1.6;margin-bottom:10px;color:var(--t1)}
.item-meta{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--t3);font-weight:400}

/* ===== Bottom Nav ===== */
/* 共通：ピル型フローティングバー */
.bnav{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(15,31,61,0.08);
  border-radius:999px;
  padding:16px 8px;
  display:flex;align-items:center;gap:4px;
  z-index:100;
  box-shadow:0 2px 8px rgba(15,31,61,0.06),0 20px 56px rgba(15,31,61,0.14),inset 0 1px 0 rgba(255,255,255,0.9);
}

/* PC: アイコン左・テキスト右の横並び */
.nav-btn{
  padding:10px 18px;
  background:transparent;border:none;
  color:#475569;
  font-size:13px;font-weight:600;
  cursor:pointer;border-radius:999px;
  display:flex;flex-direction:row;align-items:center;gap:8px;
  transition:color 0.2s ease,background 0.2s ease;
  letter-spacing:-0.01em;white-space:nowrap;
}
.nav-btn svg{width:18px;height:18px;flex-shrink:0}
.nav-btn.active{color:#1A4FA0;font-weight:600}

/* +ボタン：角丸長方形（スクリーンショットに合わせ） */
.nav-add{
  height:auto;padding:8px 26px;
  background:#1A4FA0;border:none;
  border-radius:64px;
  color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 1px 2px rgba(26,79,160,0.14),0 8px 24px rgba(26,79,160,0.28),inset 0 1px 0 rgba(255,255,255,0.18);
  flex-shrink:0;margin:0 2px;
}
.nav-add:hover{background:#163F80;transform:translateY(-1px);box-shadow:0 2px 6px rgba(26,79,160,0.18),0 16px 36px rgba(26,79,160,0.34),inset 0 1px 0 rgba(255,255,255,0.18)}
.nav-add:active{transform:translateY(0)}
.nav-add svg{width:22px;height:22px;stroke-width:2.5}

/* スマホ: アイコン上・テキスト下の縦並び */
@media(max-width:600px){
  .bnav{
    bottom:16px;
    padding:8px 16px;
    gap:0;
    max-width:calc(100vw - 24px);
  }
  .nav-btn{
    flex-direction:column;
    align-items:center;
    gap:5px;
    padding:8px 24px;
    font-size:12px;font-weight:600;
    letter-spacing:0;
    border-radius:40px;
    min-width:64px;
  }
  .nav-btn svg{width:22px;height:22px}
  .nav-add{
    height:52px;padding:0 22px;
    
    margin:0 4px;
  }
  .nav-add svg{width:24px;height:24px}
}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(17,17,17,0.4);backdrop-filter:blur(6px);z-index:200;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
@media(min-width:600px){.modal{align-items:center}}
.modal-content{background:#fff;border:1px solid var(--b);border-radius:16px 16px 0 0;padding:32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:slideUp 0.35s cubic-bezier(0.16,1,0.3,1);box-shadow:var(--shadow-modal),var(--highlight-top)}
@media(min-width:600px){.modal-content{border-radius:16px}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:#E5E5E5;border-radius:2px;margin:0 auto 24px}
@media(min-width:600px){.modal-handle{display:none}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.modal-title{font-size:22px;font-weight:700;color:var(--t1);letter-spacing:-0.03em}
.modal-close{width:32px;height:32px;background:#fff;border:1px solid var(--b);border-radius:var(--r-btn);color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-card)}
.modal-close:hover{background:var(--card-2);color:var(--t1);transform:translateY(-1px);box-shadow:var(--shadow-card-hover)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.form-group{margin-bottom:16px;min-width:0}
.form-label{display:block;font-size:13px;color:var(--t2);margin-bottom:8px;font-weight:500}
.form-input{width:100%;min-width:0;padding:12px 14px;background:var(--card-2);border:1px solid var(--b);border-radius:var(--r-btn);color:var(--t1);font-size:14px;transition:all 0.2s cubic-bezier(0.4,0,0.2,1)}
.form-input:focus{outline:none;border-color:var(--a);background:#fff;box-shadow:0 0 0 3px rgba(26,79,160,0.1),0 1px 2px rgba(26,79,160,0.05)}
textarea.form-input{resize:none;min-height:120px;line-height:1.6}
.voice-wrap{position:relative}
.voice-wrap textarea{padding-right:56px}
.voice-btn{position:absolute;right:10px;bottom:10px;width:36px;height:36px;background:#fff;border:1px solid var(--b);border-radius:var(--r-btn);color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-card)}
.voice-btn:hover{border-color:var(--bl);color:var(--t1);transform:translateY(-1px);box-shadow:var(--shadow-card-hover)}
.voice-btn.rec{background:rgba(220,38,38,0.06);border-color:rgba(220,38,38,0.3);color:#DC2626;animation:pulse 1s infinite}
.voice-btn svg{width:16px;height:16px}
.voice-status{font-size:12px;color:var(--t3);margin-top:8px;min-height:18px}
.voice-status.rec{color:#DC2626}
.form-btns{display:flex;gap:10px;margin-top:28px}
.btn{flex:1;padding:13px;border-radius:var(--r-btn);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all 0.15s;letter-spacing:-0.01em}
.btn-cancel{background:#fff;color:var(--t2);border-color:var(--b);box-shadow:var(--shadow-card),var(--highlight-top)}
.btn-cancel:hover{background:var(--card-2);color:var(--t1);transform:translateY(-1px);box-shadow:var(--shadow-card-hover),var(--highlight-top)}
.btn-cancel:active{transform:translateY(0);box-shadow:var(--shadow-card),var(--highlight-top)}
.btn-submit{background:#1A4FA0;color:#fff;box-shadow:var(--shadow-brand),var(--highlight-dark)}
.btn-submit:hover{background:#163F80;transform:translateY(-1px);box-shadow:var(--shadow-brand-hover),var(--highlight-dark)}
.btn-submit:active{transform:translateY(0);box-shadow:var(--shadow-brand),var(--highlight-dark)}

.loading{text-align:center;padding:48px 20px;color:var(--t3);font-size:14px;font-weight:500}
.loading::after{content:'';display:inline-block;width:16px;height:16px;border:2px solid var(--b);border-top-color:var(--t1);border-radius:50%;animation:spin 0.8s linear infinite;margin-left:10px;vertical-align:middle}
.dup-group{background:var(--card);border:1px solid var(--b);border-radius:var(--r-card);padding:24px;margin-bottom:14px;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-card),var(--highlight-top)}
.dup-group:hover{border-color:var(--bl);transform:translateY(-2px);box-shadow:var(--shadow-card-hover),var(--highlight-top)}
.dup-header{font-size:13px;font-weight:600;color:var(--hot);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:8px;letter-spacing:-0.01em}
@keyframes spin{to{transform:rotate(360deg)}}
.hbtn svg{transition:transform 0.3s}
#refreshBtn.spinning{color:var(--t1)}
#refreshBtn.spinning svg{animation:spin 0.8s linear infinite}
#refreshBtn:disabled{cursor:wait}
.empty{text-align:center;padding:56px 20px;color:var(--t3);font-size:14px;font-weight:500}
.hidden{display:none!important}

/* ===== Mobile optimization ===== */
@media(max-width:600px){
  .mn{padding:20px 16px;padding-bottom:calc(120px + var(--sb))}
  .card,.list-section,.ai-section,.setup-section{padding:22px}
  .setup-section{padding:24px}
  /* Typography */
  .stat-label,.bar-label,.legend-item,.ai-info p,.ai-status,.voice-status,.item-meta,.del-btn,.filter-select,.search-box input,.conn-badge,.brs,.pie-item{font-size:13px!important}
  .bar-y,.pie-label{font-size:11px!important}
  .tag{font-size:12px!important}
  .stat-val{font-size:28px}
  .card-title{font-size:15px}
  .list-title{font-size:16px}
  .modal-title{font-size:20px}
  .item-content{font-size:15px}
  /* Tap targets */
  .modal-close{width:36px;height:36px;font-size:20px}
  .del-btn{padding:7px 12px;min-height:34px}
  .qbtn{padding:9px 14px;min-height:38px}
  .btn{padding:14px;min-height:48px;font-size:15px}
  .hbtn{width:40px;height:40px}
  /* Bar chart */
  .bar-chart{gap:4px}
  .bar-group{min-width:24px}
  /* Bottom nav - 詳細はメインのmediaquery内で管理 */
  /* Search box */
  .search-box input{width:100%}
  .list-header{flex-direction:column;align-items:stretch}
  .list-filters{width:100%}
  .filter-select,.search-box{flex:1}
  /* Header brand */
  .brs{display:none}
  .brt{font-size:16px}
  .hd{padding:14px 18px}
  /* Form */
  .form-row{gap:12px}
  .modal-content{max-height:92vh;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  /* Stats */
  .stat{padding:18px 14px}
  .stat-val{font-size:26px}
  /* Pie */
  .pie-wrap.pie-main{gap:24px;padding:16px 0}
}
</style>
</head>

<div class="app">

<button class="hbtn" onclick="exportCSV()" title="エクスポート"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
<button class="hbtn" onclick="resetSettings()" title="接続設定リセット"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div>
</div>
</header>

<script>
// ===== SUPABASE CONFIG =====
var supabaseUrl = '';
var supabaseKey = '';
var isConnected = false;
var data = [];

var catColors = {良かった点:'good',改善点:'warn',トラブル:'bad',その他:'other','判定中...':'pending'};
var catHex = {良かった点:'#10B981',改善点:'#F59E0B',トラブル:'#DC2626',その他:'#8B5CF6'};

// ===== SUPABASE CONNECTION =====
async function connectSupabase() {
  var url = document.getElementById('supabaseUrl').value.trim();
  var key = document.getElementById('supabaseKey').value.trim();
  var status = document.getElementById('setupStatus');
  
  if (!url || !key) {
    status.className = 'setup-status error';
    status.textContent = '❌ URLとAPIキーを入力してください';
    return;
  }
  
  try {
    status.className = 'setup-status';
    status.style.display = 'block';
    status.style.background = 'rgba(255,255,255,0.1)';
    status.style.color = 'var(--t2)';
    status.textContent = '接続中...';
    
    supabaseUrl = url;
    supabaseKey = key;
    
    // Use fetch directly for Supabase REST API
    var testRes = await fetch(url + '/rest/v1/feedbacks?limit=1', {
      headers: {
        'apikey': key,
        'Authorization': 'Bearer ' + key
      }
    });
    
    if (!testRes.ok) {
      var errData = await testRes.json();
      throw new Error(errData.message || 'テーブル "feedbacks" が存在するか確認してください');
    }
    
    // Save to localStorage
    localStorage.setItem('wanvoice_supabase_url', url);
    localStorage.setItem('wanvoice_supabase_key', key);
    
    isConnected = true;
    status.className = 'setup-status success';
    status.textContent = '✅ 接続成功！データを読み込んでいます...';
    
    var badge = document.getElementById('connStatus');
    badge.textContent = 'LIVE';
    badge.classList.add('on');
    
    // Load data and show main content
    await loadData();
    
    setTimeout(function() {
      document.getElementById('setupSection').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
    }, 1000);
    
  } catch (err) {
    status.className = 'setup-status error';
    status.textContent = '❌ 接続失敗: ' + (err.message || 'ネットワークエラー');
  }
}

function loadScript(src) {
  return new Promise(function(resolve, reject) {
    var script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

function useLocalMode() {
  isConnected = false;
  document.getElementById('connStatus').textContent = 'LOCAL';
  document.getElementById('setupSection').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  
  // Sample data for local mode
  data = [
    {id:1,date:'2024-01-15',session:'第1回',category:'良かった点',staff:'田中',content:'参加者の反応が良い'},
    {id:2,date:'2024-01-15',session:'第1回',category:'改善点',staff:'佐藤',content:'資料の文字が小さい'}
  ];
  renderAll();
  addMsg('📱 ローカルモードで起動しました。データはブラウザ内にのみ保存されます。','bot');
}

async function loadData() {
  if (!isConnected) return;
  
  try {
    var res = await fetch(supabaseUrl + '/rest/v1/feedbacks?order=created_at.desc', {
      headers: {
        'apikey': supabaseKey,
        'Authorization': 'Bearer ' + supabaseKey
      }
    });
    
    if (!res.ok) throw new Error('データ取得エラー');
    
    data = await res.json();
    renderAll();
    addMsg('🔄 Supabaseから ' + data.length + '件のデータを読み込みました！','bot');
  } catch (err) {
    console.error('Load error:', err);
    addMsg('❌ データ読み込みエラー: ' + err.message,'bot');
  }
}

// ===== REFRESH DATA =====
async function refreshData() {
  var btn = document.getElementById('refreshBtn');
  if (btn.classList.contains('spinning')) return; // 二重クリック防止
  btn.classList.add('spinning');
  btn.disabled = true;
  
  if (!isConnected) {
    setTimeout(function(){
      btn.classList.remove('spinning');
      btn.disabled = false;
      addMsg('📱 ローカルモードではデータ更新はありません','bot');
    }, 400);
    return;
  }
  
  addMsg('🔄 更新中...','bot');
  
  try {
    var res = await fetch(supabaseUrl + '/rest/v1/feedbacks?order=created_at.desc', {
      headers: {
        'apikey': supabaseKey,
        'Authorization': 'Bearer ' + supabaseKey,
        'Cache-Control': 'no-cache'
      }
    });
    
    if (!res.ok) throw new Error('更新エラー');
    
    var newData = await res.json();
    var diff = newData.length - data.length;
    data = newData;
    renderAll();
    
    // 直前の「更新中...」メッセージを削除
    var box = document.getElementById('chatBox');
    var msgs = box.querySelectorAll('.msg.bot');
    if (msgs.length && msgs[msgs.length - 1].textContent.indexOf('更新中') !== -1) {
      msgs[msgs.length - 1].remove();
    }
    
    if (diff > 0) {
      addMsg('✅ 更新完了! ' + diff + '件の新しいデータがあります','bot');
    } else if (diff < 0) {
      addMsg('✅ 更新完了! ' + Math.abs(diff) + '件削除されました','bot');
    } else {
      addMsg('✅ 最新の状態です(' + data.length + '件)','bot');
    }
  } catch (err) {
    addMsg('❌ 更新エラー: ' + err.message,'bot');
  }
  
  btn.classList.remove('spinning');
  btn.disabled = false;
}

// ===== AUTO RECONNECT =====
function autoReconnect() {
  var savedUrl = localStorage.getItem('wanvoice_supabase_url');
  var savedKey = localStorage.getItem('wanvoice_supabase_key');
  
  if (savedUrl && savedKey) {
    document.getElementById('supabaseUrl').value = savedUrl;
    document.getElementById('supabaseKey').value = savedKey;
    connectSupabase();
  }
}

// ===== DATA OPERATIONS =====
async function addEntry() {
  var d = document.getElementById('inputDate').value;
  var s = document.getElementById('inputSession').value;
  var st = document.getElementById('inputStaff').value;
  var co = document.getElementById('inputContent').value;
  
  if (!d || !s || !st || !co) {
    alert('全て入力してください');
    return;
  }
  
  // 初期値は「判定中...」で楽観的保存
  var newEntry = {
    date: d,
    session: s,
    category: '判定中...',
    staff: st,
    content: co
  };
  
  var savedEntry = null;
  
  if (isConnected) {
    try {
      var res = await fetch(supabaseUrl + '/rest/v1/feedbacks', {
        method: 'POST',
        headers: {
          'apikey': supabaseKey,
          'Authorization': 'Bearer ' + supabaseKey,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(newEntry)
      });
      
      if (!res.ok) throw new Error('保存エラー');
      
      var inserted = await res.json();
      savedEntry = inserted[0];
      data.unshift(savedEntry);
      addMsg('✅ 保存しました。AIがカテゴリを判定中...','bot');
    } catch (err) {
      alert('保存エラー: ' + err.message);
      return;
    }
  } else {
    newEntry.id = Date.now();
    savedEntry = newEntry;
    data.unshift(savedEntry);
    addMsg('✅ ローカルに保存しました。AIがカテゴリを判定中...','bot');
  }
  
  closeModal();
  renderAll();
  // 前回値を保存(スタッフ名・回)
  localStorage.setItem('wanvoice_last_staff', st);
  localStorage.setItem('wanvoice_last_session', s);
  // 回の履歴を更新(重複排除、最新20件)
  var history = JSON.parse(localStorage.getItem('wanvoice_session_history') || '[]');
  history = history.filter(function(x){ return x !== s; });
  history.unshift(s);
  if (history.length > 20) history = history.slice(0, 20);
  localStorage.setItem('wanvoice_session_history', JSON.stringify(history));
  rebuildSessionDatalist();
  // 内容のみクリア(スタッフ名・回は保持)
  document.getElementById('inputContent').value = '';
  
  // バックグラウンドでカテゴリ判定
  classifyAndUpdate(savedEntry);
}

// Edge Function でカテゴリ判定 → エントリを更新
async function classifyAndUpdate(entry) {
  try {
    var category = await classifyFeedback(entry.content);
    entry.category = category;
    
    // Supabase 接続中なら PATCH で更新
    if (isConnected && entry.id) {
      await fetch(supabaseUrl + '/rest/v1/feedbacks?id=eq.' + entry.id, {
        method: 'PATCH',
        headers: {
          'apikey': supabaseKey,
          'Authorization': 'Bearer ' + supabaseKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ category: category })
      });
    }
    
    renderAll();
    addMsg('🏷️ カテゴリ判定完了: <b>' + category + '</b>', 'bot');
  } catch (err) {
    entry.category = 'その他';
    renderAll();
    addMsg('⚠️ カテゴリ判定に失敗しました(「その他」に設定)', 'bot');
    console.error('classifyAndUpdate error:', err);
  }
}

// Edge Function を呼び出してカテゴリを取得
async function classifyFeedback(content) {
  if (!isConnected) {
    // ローカルモードではキーワードベースの簡易判定にフォールバック
    return classifyLocal(content);
  }
  var res = await fetch(supabaseUrl + '/functions/v1/classify-feedback', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + supabaseKey,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ content: content })
  });
  if (!res.ok) throw new Error('classify-feedback HTTP ' + res.status);
  var json = await res.json();
  return json.category || 'その他';
}

// ローカルモード用の簡易分類(フォールバック)
function classifyLocal(content) {
  var c = content.toLowerCase();
  if (/エラー|動かな|動作しな|壊れ|故障|トラブル|不具合|バグ|クレーム|苦情/.test(c)) return 'トラブル';
  if (/良|いい|よかっ|助か|便利|好評|嬉し|感謝|ありがと|最高|満足/.test(c)) return '良かった点';
  if (/改善|直|欲し|〜すべき|してほしい|見づら|読みにく|小さ|分かりにく|わかりにく/.test(c)) return '改善点';
  return 'その他';
}

async function deleteEntry(id) {
  if (!confirm('削除しますか？')) return;
  
  if (isConnected) {
    try {
      var res = await fetch(supabaseUrl + '/rest/v1/feedbacks?id=eq.' + id, {
        method: 'DELETE',
        headers: {
          'apikey': supabaseKey,
          'Authorization': 'Bearer ' + supabaseKey
        }
      });
      if (!res.ok) throw new Error('削除エラー');
    } catch (err) {
      alert('削除エラー: ' + err.message);
      return;
    }
  }
  
  data = data.filter(function(d) { return d.id !== id; });
  renderAll();
}

// ===== VOICE =====
var recognition = null, isRec = false;
function initVoice() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { var b = document.getElementById('voiceBtn'); if (b) b.style.display = 'none'; return; }
  recognition = new SR(); recognition.lang = 'ja-JP'; recognition.continuous = false; recognition.interimResults = true;
  recognition.onresult = function(e) { var f = '', t = ''; for (var i = 0; i < e.results.length; i++) { if (e.results[i].isFinal) f += e.results[i][0].transcript; else t += e.results[i][0].transcript; } if (f) document.getElementById('inputContent').value += f; document.getElementById('voiceStatus').textContent = t || (isRec ? '🎤 話してください...' : ''); };
  recognition.onerror = function(e) { if (e.error === 'no-speech' && isRec) setTimeout(startRec, 300); else if (e.error === 'not-allowed') { document.getElementById('voiceStatus').textContent = '⚠️ マイク許可が必要'; stopVoice(); } };
  recognition.onend = function() { if (isRec) setTimeout(startRec, 300); };
}
function startRec() { if (!isRec || !recognition) return; try { recognition.start(); } catch (e) {} }
function toggleVoice() {
  if (!recognition) { alert('音声入力に対応していません'); return; }
  if (isRec) { stopVoice(); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function() { isRec = true; recognition.start(); document.getElementById('voiceBtn').classList.add('rec'); document.getElementById('voiceStatus').textContent = '🔴 録音中...'; document.getElementById('voiceStatus').classList.add('rec'); }).catch(function() { document.getElementById('voiceStatus').textContent = '⚠️ マイク許可が必要'; });
}
function stopVoice() { isRec = false; try { recognition.abort(); } catch (e) {} document.getElementById('voiceBtn').classList.remove('rec'); document.getElementById('voiceStatus').textContent = ''; document.getElementById('voiceStatus').classList.remove('rec'); }

// ===== ESCAPE =====
function esc(s) { return s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : ''; }

// ===== STATS =====
function getStats(source) { var src = source || data; var c = {}, s = {}; src.forEach(function(d) { c[d.category] = (c[d.category] || 0) + 1; s[d.session] = s[d.session] || { total: 0 }; s[d.session].total++; s[d.session][d.category] = (s[d.session][d.category] || 0) + 1; }); return { cat: c, sess: s }; }
function getSessions() { return [...new Set(data.map(function(d) { return d.session; }))].sort(); }

// ===== SIMILARITY =====
function normalizeForSim(s) {
  if (!s) return '';
  // 小文字化・記号/空白除去
  var n = s.toLowerCase().replace(/[、。！？\?\!\.,\s　「」『』()（）\-_/／\\]/g, '');
  // カタカナ→ひらがな統一
  n = n.replace(/[\u30a1-\u30f6]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0x60); });
  // 助詞除去(文意を損なわない範囲)
  n = n.replace(/[はがをにでとのもやへ]/g, '');
  return n;
}
function ngrams(s, n) { var g = new Set(); for (var i = 0; i <= s.length - n; i++) g.add(s.substring(i, i + n)); return g; }
function jaccard(g1, g2) { if (!g1.size || !g2.size) return 0; var n = 0; g1.forEach(function(x){ if (g2.has(x)) n++; }); var u = g1.size + g2.size - n; return u > 0 ? n / u : 0; }
function calcSim(a, b) {
  var s1 = normalizeForSim(a), s2 = normalizeForSim(b);
  if (s1 === s2) return 1;
  if (s1.length < 2 || s2.length < 2) return 0;
  // bi-gram と tri-gram のハイブリッド(短文耐性+意味一致精度)
  var bi = jaccard(ngrams(s1, 2), ngrams(s2, 2));
  var tri = (s1.length >= 3 && s2.length >= 3) ? jaccard(ngrams(s1, 3), ngrams(s2, 3)) : bi;
  // 部分包含ボーナス(短い方が長い方に含まれていたら加点)
  var shorter = s1.length < s2.length ? s1 : s2;
  var longer = s1.length < s2.length ? s2 : s1;
  var contain = longer.indexOf(shorter) !== -1 ? 0.15 : 0;
  return Math.min(1, bi * 0.35 + tri * 0.55 + contain);
}
function findDups() { var dups = [], checked = new Set(); for (var i = 0; i < data.length; i++) { if (checked.has(data[i].id)) continue; var sim = []; for (var j = i + 1; j < data.length; j++) { if (checked.has(data[j].id)) continue; var s = calcSim(data[i].content, data[j].content); if (s > 0.5) { sim.push({ item: data[j], sim: s }); checked.add(data[j].id); } } if (sim.length) { dups.push({ orig: data[i], sim: sim }); checked.add(data[i].id); } } return dups; }
function getDupIds() { var dups = findDups(), ids = new Set(); dups.forEach(function(g) { ids.add(g.orig.id); g.sim.forEach(function(x) { ids.add(x.item.id); }); }); return ids; }

  bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>'
};

// ===== RENDER =====
function renderStats() {
  var dashData = getDashData();
  var st = getStats(dashData), dups = findDups();
  document.getElementById('statsGrid').innerHTML =
    '<div class="stat"><div class="stat-icon">' + icons.layers + '</div><div class="stat-val">' + dashData.length + '</div><div class="stat-label">総件数</div></div>' +
    '<div class="stat good"><div class="stat-icon">' + icons.thumbsUp + '</div><div class="stat-val">' + (st.cat['良かった点'] || 0) + '</div><div class="stat-label">良かった点</div></div>' +
    '<div class="stat warn"><div class="stat-icon">' + icons.lightbulb + '</div><div class="stat-val">' + (st.cat['改善点'] || 0) + '</div><div class="stat-label">改善点</div></div>' +
    '<div class="stat bad"><div class="stat-icon">' + icons.alertTriangle + '</div><div class="stat-val">' + (st.cat['トラブル'] || 0) + '</div><div class="stat-label">トラブル</div></div>' +
    '<div class="stat hot"><div class="stat-icon">' + icons.flame + '</div><div class="stat-val">' + dups.length + '</div><div class="stat-label">Hot!Voice</div></div>';

// Dashboard filter state
var dashSessionFilter = 'all';
function getDashData() {
  return dashSessionFilter === 'all' ? data : data.filter(function(d){ return d.session === dashSessionFilter; });
}
function onDashFilterChange() {
  dashSessionFilter = document.getElementById('dashSessionFilter').value;
  renderStats();
  renderPieChart();
}

function renderPieChart() {
  var dashData = getDashData();
  var st = getStats(dashData), t = dashData.length;
  if (!t) { document.getElementById('pieChart').innerHTML = '<div class="empty">データなし</div>'; return; }
  var gr = [], cur = 0, lg = '';
  Object.keys(catHex).forEach(function(c) { var n = st.cat[c] || 0, p = n / t * 100; if (p > 0) { gr.push(catHex[c] + ' ' + cur + '% ' + (cur + p) + '%'); cur += p; } lg += '<div class="pie-item"><div class="pie-dot" style="background:' + catHex[c] + '"></div><span>' + c + '</span><span class="pie-pct">' + Math.round(n / t * 100) + '%</span></div>'; });
  document.getElementById('pieChart').innerHTML = '<div class="pie-container"><div class="pie" style="background:conic-gradient(' + gr.join(',') + ')"></div><div class="pie-center"><div class="pie-val">' + t + '</div><div class="pie-label">TOTAL</div></div></div><div class="pie-legend">' + lg + '</div>';
}

function updateFilters() {
  var ss = getSessions();
  // リスト画面の回フィルター
  var sel = document.getElementById('filterSession');
  sel.innerHTML = '<option value="all">全ての回</option>';
  ss.forEach(function(s) { sel.innerHTML += '<option value="' + s + '">' + s + '</option>'; });
  // ダッシュボード画面の回フィルター
  var dsel = document.getElementById('dashSessionFilter');
  if (dsel) {
    var cur = dashSessionFilter;
    dsel.innerHTML = '<option value="all">全ての回</option>';
    ss.forEach(function(s) { dsel.innerHTML += '<option value="' + s + '"' + (s === cur ? ' selected' : '') + '>' + s + '</option>'; });
    // 以前選択した回がデータから消えていたら 'all' に戻す
    if (cur !== 'all' && ss.indexOf(cur) === -1) { dashSessionFilter = 'all'; dsel.value = 'all'; }
  }
}

function renderList() {
  var q = document.getElementById('searchInput').value.toLowerCase(), fs = document.getElementById('filterSession').value, fc = document.getElementById('filterCategory').value, dupIds = getDupIds();
  var filtered = data.filter(function(d) { return (d.content.toLowerCase().indexOf(q) !== -1 || d.staff.toLowerCase().indexOf(q) !== -1) && (fs === 'all' || d.session === fs) && (fc === 'all' || d.category === fc); });
  if (!filtered.length) { document.getElementById('dataList').innerHTML = '<div class="empty">データがありません</div>'; return; }
  var html = ''; filtered.forEach(function(d) { var isDup = dupIds.has(d.id); html += '<div class="data-item' + (isDup ? ' dup' : '') + '"><div class="item-header"><div class="item-tags"><span class="tag ' + catColors[d.category] + '">' + esc(d.category) + '</span></div><button class="del-btn" onclick="deleteEntry(' + d.id + ')">削除</button></div><div class="item-content">' + esc(d.content) + '</div><div class="item-meta"><span>' + icons.calendar + esc(d.date) + '</span><span>' + icons.user + esc(d.staff) + '</span><span>' + icons.bookmark + esc(d.session) + '</span></div></div>'; });
  document.getElementById('dataList').innerHTML = html;
}

function renderAll() { updateFilters(); renderStats(); renderPieChart(); renderList(); }

// ===== AI CHAT =====
function sendChat() { var input = document.getElementById('chatInput'), msg = input.value.trim(); if (!msg) return; addMsg(msg, 'user'); input.value = ''; showTyping(); setTimeout(function() { hideTyping(); addMsg(generateAI(msg), 'bot'); }, 800); }
function askBot(q) { document.getElementById('chatInput').value = q; sendChat(); }
function addMsg(txt, type) { var box = document.getElementById('chatBox'), div = document.createElement('div'); div.className = 'msg ' + type; div.innerHTML = txt; box.appendChild(div); box.scrollTop = box.scrollHeight; }
function showTyping() { var box = document.getElementById('chatBox'), div = document.createElement('div'); div.className = 'msg bot typing-ind'; div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; box.appendChild(div); box.scrollTop = box.scrollHeight; }
function hideTyping() { var t = document.querySelector('.typing-ind'); if (t) t.remove(); }

function generateAI(q) {
  var ql = q.toLowerCase().replace(/[？?！!。、\s]/g, '');
  var st = getStats(), ss = getSessions();
  
  // キーワードマッチング（柔軟に）
  var patterns = {
    summary: ['要約','まとめ','概要','全体','サマリ','総括','ぜんぶ','すべて','全部','どんな感じ','状況','レポート'],
    problem: ['問題','トラブル','課題','困','悪い','ダメ','だめ','改善','直す','なおす','修正','バグ','エラー','クレーム','苦情','不満','心配','懸念','ネガティブ','negative'],
    good: ['良','いい','よい','よかった','ポジティブ','positive','good','グッド','好評','評判','成功','うまく','嬉しい','感謝','ありがと','褒め'],
    priority: ['hot','ホット','よく出','多い','頻出','繰り返','重複','似た','類似'],
    trend: ['傾向','推移','分析','変化','比較','トレンド','グラフ','チャート','経過','流れ'],
    staff: ['誰','だれ','スタッフ','担当','人','メンバー','名前'],
    count: ['何件','なんけん','いくつ','数','カウント','件数'],
    recent: ['最近','最新','新しい','今日','昨日','さっき'],
    search: ['検索','探','さがす','見つけ','ある？','ありますか','について']
  };
  
  // パターンマッチ
  function match(keys) {
    return keys.some(function(k) { return ql.includes(k); });
  }
  
  // 要約
  if (match(patterns.summary) || ql.length < 3) {
    return '📊 <b>フィードバック要約</b><br><br>' +
      '全<b>' + data.length + '件</b>（' + ss.length + '回分）<br><br>' +
      '👍 良かった点: ' + (st.cat['良かった点'] || 0) + '件<br>' +
      '✏️ 改善点: ' + (st.cat['改善点'] || 0) + '件<br>' +
      '⚠️ トラブル: ' + (st.cat['トラブル'] || 0) + '件<br>' +
      (isConnected ? '<br><br>☁️ Supabaseに保存中' : '');
  }
  
  // 問題・改善点
  if (match(patterns.problem)) {
    var probs = data.filter(function(d) { return d.category === 'トラブル' || d.category === '改善点'; });
    if (!probs.length) return '✅ 問題点や改善点の報告はありません！素晴らしいですね👏';
    var r = '⚠️ <b>問題点・改善点（' + probs.length + '件）</b><br><br>';
    probs.slice(0, 5).forEach(function(p) {
      r += '• ' + esc(p.content) + '<br><small style="color:var(--t3)">' + p.session + ' / ' + p.staff + '</small><br><br>';
    });
    if (probs.length > 5) r += '<small>他 ' + (probs.length - 5) + '件...</small>';
    return r;
  }
  
  // 良かった点
  if (match(patterns.good)) {
    var goods = data.filter(function(d) { return d.category === '良かった点'; });
    if (!goods.length) return '良かった点の報告はまだありません。これから増えるといいですね！';
    var r = '👍 <b>良かった点（' + goods.length + '件）</b><br><br>';
    goods.slice(0, 5).forEach(function(g) {
      r += '• ' + esc(g.content) + '<br><small style="color:var(--t3)">' + g.session + ' / ' + g.staff + '</small><br><br>';
    });
    if (goods.length > 5) r += '<small>他 ' + (goods.length - 5) + '件...</small>';
    return r;
  }
  
  // Hot!Voice(よく出る声)
  if (match(patterns.priority)) {
    var dups = findDups();
    if (!dups.length) return '✅ 似た声の繰り返しはまだありません';
    dups.sort(function(a, b){ return b.sim.length - a.sim.length; });
    var r = '🔥 <b>Hot!Voice - よく出ている声</b><br><br>';
    dups.slice(0, 5).forEach(function(g, i) {
      var count = g.sim.length + 1;
      r += (i + 1) + '. ' + esc(g.orig.content) + '<br><small style="color:var(--t3)">' + count + '件の類似 / ' + g.orig.category + '</small><br><br>';
    });
    return r;
  }
  
  // 傾向分析
  if (match(patterns.trend)) {
    if (!ss.length) return '📈 まだデータがないので傾向分析できません';
    var r = '📈 <b>傾向分析</b><br><br>';
    ss.forEach(function(s) {
      var d = st.sess[s] || {}, g = d['良かった点'] || 0, b = (d['改善点'] || 0) + (d['トラブル'] || 0);
      var emoji = g > b ? '😊' : g < b ? '😟' : '😐';
      r += emoji + ' <b>' + s + '</b>: 👍' + g + ' / 📝' + b + '<br>';
    });
    var totalGood = st.cat['良かった点'] || 0;
    var totalBad = (st.cat['改善点'] || 0) + (st.cat['トラブル'] || 0);
    r += '<br><b>全体:</b> ' + (totalGood > totalBad ? 'ポジティブ傾向 📈' : totalGood < totalBad ? '改善の余地あり 📉' : 'バランス型 ➡️');
    return r;
  }
  
  // スタッフ別
  if (match(patterns.staff)) {
    var staffCounts = {};
    data.forEach(function(d) { staffCounts[d.staff] = (staffCounts[d.staff] || 0) + 1; });
    var staffList = Object.keys(staffCounts).sort(function(a, b) { return staffCounts[b] - staffCounts[a]; });
    if (!staffList.length) return '👤 スタッフデータがありません';
    var r = '👤 <b>スタッフ別投稿数</b><br><br>';
    staffList.forEach(function(s) { r += '• ' + esc(s) + ': ' + staffCounts[s] + '件<br>'; });
    return r;
  }
  
  // 件数
  if (match(patterns.count)) {
    return '📊 現在 <b>' + data.length + '件</b> のフィードバックがあります<br><br>' +
      '👍 良かった点: ' + (st.cat['良かった点'] || 0) + '件<br>' +
      '✏️ 改善点: ' + (st.cat['改善点'] || 0) + '件<br>' +
      '⚠️ トラブル: ' + (st.cat['トラブル'] || 0) + '件<br>' +
      '💜 その他: ' + (st.cat['その他'] || 0) + '件';
  }
  
  // 最近
  if (match(patterns.recent)) {
    if (!data.length) return '📭 まだデータがありません';
    var recent = data.slice(0, 3);
    var r = '🕐 <b>最近のフィードバック</b><br><br>';
    recent.forEach(function(d) {
      r += '• [' + d.category + '] ' + esc(d.content) + '<br><small style="color:var(--t3)">' + d.date + ' / ' + d.staff + '</small><br><br>';
    });
    return r;
  }
  
  // 特定の回
  var sessionMatch = ql.match(/(\d+)/);
  if (sessionMatch && (ql.includes('回') || ql.includes('第'))) {
    var ts = '第' + sessionMatch[1] + '回';
    var sd = data.filter(function(d) { return d.session === ts; });
    if (!sd.length) return '📋 ' + ts + 'のデータはまだありません';
    var r = '📋 <b>' + ts + '（' + sd.length + '件）</b><br><br>';
    sd.forEach(function(d) { r += '• [' + d.category + '] ' + esc(d.content) + '<br>'; });
    return r;
  }
  
  // キーワード検索（フォールバック）
  if (match(patterns.search) || ql.length >= 2) {
    var keyword = ql.replace(/検索|探して|さがして|ある|ありますか|について|教えて|おしえて/g, '').trim();
    if (keyword.length >= 2) {
      var found = data.filter(function(d) {
        return d.content.toLowerCase().includes(keyword) || 
               d.staff.toLowerCase().includes(keyword) ||
               d.session.includes(keyword);
      });
      if (found.length) {
        var r = '🔍 <b>「' + keyword + '」の検索結果（' + found.length + '件）</b><br><br>';
        found.slice(0, 5).forEach(function(f) {
          r += '• ' + esc(f.content) + '<br><small style="color:var(--t3)">' + f.category + ' / ' + f.session + ' / ' + f.staff + '</small><br><br>';
        });
        return r;
      }
    }
  }
  
  // どれにもマッチしない場合、データから関連を探す
  var anyMatch = data.filter(function(d) {
    return d.content.toLowerCase().includes(ql.substring(0, 3));
  });
  if (anyMatch.length) {
    var r = '🔍 「' + q + '」に関連しそうなデータ：<br><br>';
    anyMatch.slice(0, 3).forEach(function(m) {
      r += '• ' + esc(m.content) + '<br>';
    });
    return r;
  }
  
  // 最終フォールバック
  return '🤖 「' + esc(q) + '」ですね！<br><br>' +
    '現在のデータ: ' + data.length + '件<br><br>' +
    '質問例：<br>' +
    '• 「まとめて」「状況は？」<br>' +
    '• 「問題ある？」「困ってること」<br>' +
    '• 「良かったこと」「うまくいったの」<br>' +
    '• 「急ぎのやつ」「優先高いの」<br>' +
    '• 「第1回どうだった？」<br>' +
    '• 「〇〇で検索」';
}

// ===== MODAL =====
function openModal() {
  document.getElementById('modal').classList.add('show');
  document.body.classList.add('modal-open');
  document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
  // 前回値を復元
  var lastStaff = localStorage.getItem('wanvoice_last_staff') || '';
  var lastSession = localStorage.getItem('wanvoice_last_session') || '';
  if (!document.getElementById('inputStaff').value) document.getElementById('inputStaff').value = lastStaff;
  if (!document.getElementById('inputSession').value) document.getElementById('inputSession').value = lastSession;
  rebuildSessionDatalist();
}
function closeModal() { stopVoice(); document.getElementById('modal').classList.remove('show'); document.body.classList.remove('modal-open'); }

// 回のdatalistを履歴から再構築
function rebuildSessionDatalist() {
  var dl = document.getElementById('sessionHistory');
  if (!dl) return;
  var history = JSON.parse(localStorage.getItem('wanvoice_session_history') || '[]');
  dl.innerHTML = history.map(function(s){ return '<option value="' + s.replace(/"/g,'&quot;') + '">'; }).join('');
}

// 接続設定リセット
function resetSettings() {
  if (!confirm('接続設定(URL/KEY)をリセットしますか?\n※ フィードバック履歴・スタッフ名・回の履歴は保持されます')) return;
  localStorage.removeItem('wanvoice_supabase_url');
  localStorage.removeItem('wanvoice_supabase_key');
  location.reload();
}

// ===== NAVIGATION =====
function switchTab(tab) {
  // Hide all tabs
  document.getElementById('tabDash').classList.add('hidden');
  document.getElementById('tabList').classList.add('hidden');
  document.getElementById('tabDup').classList.add('hidden');
  
  // Remove active from all nav buttons
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  
  // Show selected tab and activate button
  if (tab === 'Dash') {
    document.getElementById('tabDash').classList.remove('hidden');
    document.querySelectorAll('.nav-btn')[0].classList.add('active');
  } else if (tab === 'List') {
    document.getElementById('tabList').classList.remove('hidden');
    document.querySelectorAll('.nav-btn')[1].classList.add('active');
    renderList();
  } else if (tab === 'Dup') {
    document.getElementById('tabDup').classList.remove('hidden');
    document.querySelectorAll('.nav-btn')[2].classList.add('active');
    renderDuplicates();
  }
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== HOT!VOICE (類似グループ) =====
function renderDuplicates() {
  var dups = findDups();
  var container = document.getElementById('dupList');
  
  if (!dups.length) {
    container.innerHTML = '<div class="empty">似た声のグループはまだありません</div>';
    return;
  }
  
  // 件数が多い順にソート
  dups.sort(function(a, b){ return b.sim.length - a.sim.length; });
  
  var html = '';
  dups.forEach(function(g, i) {
    var count = g.sim.length + 1;
    html += '<div class="dup-group">';
    html += '<div class="dup-header">' + icons.flame + 'Hot #' + (i + 1) + ' · ' + count + '件の似た声</div>';
    
    // Original
    html += '<div class="data-item">';
    html += '<div class="item-header"><div class="item-tags"><span class="tag ' + catColors[g.orig.category] + '">' + esc(g.orig.category) + '</span></div></div>';
    html += '<div class="item-content">' + esc(g.orig.content) + '</div>';
    html += '<div class="item-meta"><span>' + icons.user + esc(g.orig.staff) + '</span><span>' + icons.bookmark + esc(g.orig.session) + '</span></div>';
    html += '</div>';
    
    // Similar items
    g.sim.forEach(function(s) {
      html += '<div class="data-item dup">';
      html += '<div class="item-header"><div class="item-tags"><span class="tag ' + catColors[s.item.category] + '">' + esc(s.item.category) + '</span><span class="tag warn">' + Math.round(s.sim * 100) + '% 類似</span></div></div>';
      html += '<div class="item-content">' + esc(s.item.content) + '</div>';
      html += '<div class="item-meta"><span>' + icons.user + esc(s.item.staff) + '</span><span>' + icons.bookmark + esc(s.item.session) + '</span></div>';
      html += '</div>';
    });
    
    html += '</div>';
  });
  
  container.innerHTML = html;
}

// ===== CSV =====
function exportCSV() {
  var h = ['date', 'session', 'category', 'staff', 'content'], csv = h.join(',') + '\n';
  data.forEach(function(d) { csv += h.map(function(k) { return '"' + (d[k] || '') + '"'; }).join(',') + '\n'; });
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); a.download = 'wanvoice_' + new Date().toISOString().split('T')[0] + '.csv'; a.click();
}

document.getElementById('csvImport').addEventListener('change', async function(e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader(); r.onload = async function(ev) {
    try {
      var lines = ev.target.result.split('\n'), hd = lines[0].split(',').map(function(h) { return h.trim().replace(/"/g, ''); }), cnt = 0;
      var newEntries = [];
      for (var i = 1; i < lines.length; i++) {
        var ln = lines[i].trim(); if (!ln) continue;
        var vals = ln.split(',').map(function(v) { return v.trim().replace(/"/g, ''); });
        newEntries.push({
          date: vals[hd.indexOf('date')] || vals[0] || '',
          session: vals[hd.indexOf('session')] || vals[1] || '',
          category: vals[hd.indexOf('category')] || vals[2] || '良かった点',
          staff: vals[hd.indexOf('staff')] || vals[3] || '',
          content: vals[hd.indexOf('content')] || vals[4] || ''
        });
        cnt++;
      }
      
      if (isConnected && newEntries.length) {
        var res = await fetch(supabaseUrl + '/rest/v1/feedbacks', {
          method: 'POST',
          headers: {
            'apikey': supabaseKey,
            'Authorization': 'Bearer ' + supabaseKey,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(newEntries)
        });
        if (!res.ok) throw new Error('インポートエラー');
        var inserted = await res.json();
        data = inserted.concat(data);
      } else {
        newEntries.forEach(function(e, i) { e.id = Date.now() + i; data.unshift(e); });
      }
      
      renderAll();
      addMsg('📥 ' + cnt + '件インポートしました！', 'bot');
    } catch (err) { alert('インポート失敗: ' + err.message); }
    e.target.value = '';
  }; r.readAsText(f);
});

document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ===== INIT =====
initVoice();
autoReconnect();
rebuildSessionDatalist();
